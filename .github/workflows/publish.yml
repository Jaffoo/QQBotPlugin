name: Publish NuGet

on:
  push:
    tags:
      - 'v*'   # 推送 v1.0.0 这类 tag 时触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Trusted Publishing 必需
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # 改成你自己的 .NET 版本

      - name: Build and Pack
        run: dotnet pack ./IPluginBase/IPluginBase.csproj -c Release -o ./nupkg /p:Version=${GITHUB_REF#refs/tags/v}

      - name: NuGet IPluginBase
        uses: NuGet/login@v1
        id: IPluginBase
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate